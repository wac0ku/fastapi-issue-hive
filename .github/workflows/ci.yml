name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-uv provisions the interpreter itself, so no separate setup-python step.
      # python-version overrides the .python-version file for this matrix leg.
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --locked fails the build if uv.lock is out of sync with pyproject.toml
      # instead of silently re-resolving.
      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests (no API keys required)
        run: uv run pytest -v

[project]
name = "fastapi-issue-hive"
version = "1.0.0"
description = "Hive-mind multi-agent system that analyzes GitHub issues and diagnoses FastAPI connectivity problems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "wac0ku" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
]

# PEP 735 dependency group — read natively by uv (`uv sync` installs it by default,
# `uv sync --no-dev` skips it, which is what the Docker build does).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

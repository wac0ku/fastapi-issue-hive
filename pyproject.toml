[project]
name = "fastapi-issue-hive"
version = "1.0.0"
description = "Hive-mind multi-agent system that analyzes GitHub issues and diagnoses FastAPI connectivity problems"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "wac0ku" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anthropic>=0.40",
]

# PEP 735 dependency group — read natively by uv (`uv sync` installs it by default,
# `uv sync --no-dev` skips it, which is what the Docker build does).
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=90"
# Warnings are failures: a deprecation that goes unnoticed here becomes a broken build
# the day upstream removes it. Add narrow ignores rather than relaxing this.
filterwarnings = [
    "error",
    # starlette's TestClient still imports httpx; nothing we can do until httpx2 lands.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
# Ruff also formats Python blocks inside Markdown; the docs use hand-aligned comment
# columns for illustration, which the formatter would collapse.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# Line length is the formatter's job; ANN is left out on purpose because mypy strict
# already enforces annotations and reporting both would double up.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; the "passwords" are fixture strings for mocked calls.
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
